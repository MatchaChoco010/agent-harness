[package]
name = "agent-harness"
version = "0.1.0"
edition = "2021"
description = "共有ハーネスをプロジェクトへ導入・更新する CLI"
repository = "https://github.com/MatchaChoco010/agent-harness"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# preserve_order: 既存の設定 JSON にマージ書き戻しするとき、ユーザーが書いたキー順を保つ。
serde_json = { version = "1", features = ["preserve_order"] }
