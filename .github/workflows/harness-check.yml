name: harness-check

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check for scripts
        run: |
          set -e
          for f in $(find harness/scripts -name '*.mjs'); do
            node --check "$f"
          done
      - name: Generated files are in sync
        run: node harness/scripts/sync/harness-sync.mjs --check --source .
      - name: CLI builds
        run: cargo check --quiet
